name: fancad
description: "FanCAD - an AI-native, plugin-everything 2D CAD application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.3

workspace:
  - pkg/fancad_core
  - pkg/fancad_io
  - pkg/fancad_render
  - pkg/fancad_plugin_host
  - pkg/fancad_ai
  - pkg/fancad_ops

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  fancad_core:
    path: pkg/fancad_core
  fancad_io:
    path: pkg/fancad_io
  fancad_render:
    path: pkg/fancad_render
  fancad_plugin_host:
    path: pkg/fancad_plugin_host
  fancad_ai:
    path: pkg/fancad_ai
  fancad_ops:
    path: pkg/fancad_ops

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_markdown: ^0.7.7+1
  window_manager: ^0.4.3
  path: ^1.9.0
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  meta: ^1.16.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  riverpod_annotation: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.5
  flutter_launcher_icons: ^0.14.4

hooks:
  user_defines:
    fancad_io:
      # Optional. Leave empty to compile the LibreDWG submodule in
      # pkg/fancad_io/native/third_party/libredwg.
      libredwg_root: ''

flutter:
  uses-material-design: true
  generate: true
  assets:
    - extensions/
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/logo.png"
  windows:
    generate: true
    image_path: "assets/icons/logo.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icons/logo_mac.png"
