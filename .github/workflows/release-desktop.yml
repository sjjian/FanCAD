name: Release Desktop

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.4

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(sed -n 's/^version:[[:space:]]*\([^+]*\).*/\1/p' pubspec.yaml | head -n1)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Accept both 0.6.0 and v0.6.0; the feed strips the v as well.
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${PUBSPEC_VERSION}"
          fi
          if [[ -z "${VERSION}" ]]; then
            echo "Could not resolve a version" >&2
            exit 1
          fi
          if [[ "${VERSION}" != "${PUBSPEC_VERSION}" ]]; then
            echo "Tag ${VERSION} does not match pubspec ${PUBSPEC_VERSION}" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake
        run: brew install cmake

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS release
        env:
          FANCAD_REQUIRE_LIBREDWG: "1"
        run: flutter build macos --release

      - name: Package DMG
        run: |
          chmod +x scripts/package_macos_dmg.sh
          scripts/package_macos_dmg.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fancad-macos
          path: dist/fancad-macos-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake
        run: choco install cmake -y

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          FANCAD_REQUIRE_LIBREDWG: "1"
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ needs.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "windows\installer\fancad.iss" `
            "/DMyAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: fancad-windows
          path: dist/fancad-windows-setup-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          FANCAD_REQUIRE_LIBREDWG: "1"
        run: flutter build linux --release

      - name: Package tarball
        run: |
          version="${{ needs.version.outputs.version }}"
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/fancad-linux-${version}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: fancad-linux
          path: dist/fancad-linux-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, build-macos, build-windows, build-linux]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/fancad-macos/*.dmg release-assets/
          cp artifacts/fancad-windows/*.exe release-assets/
          cp artifacts/fancad-linux/*.tar.gz release-assets/
          ls -la release-assets

      - name: Require changelog
        shell: bash
        run: |
          if [[ ! -s changelog_latest.md ]] || [[ -z "$(tr -d '[:space:]' < changelog_latest.md)" ]]; then
            echo "changelog_latest.md is missing or empty" >&2
            exit 1
          fi

      - name: Build update manifest
        run: |
          scripts/generate_update_manifest.sh \
            "${{ needs.version.outputs.version }}" release-assets

      - name: Sign update manifest
        env:
          UPDATE_KEY_B64: ${{ secrets.FANCAD_UPDATE_KEY_B64 }}
          UPDATE_KEY_PASSPHRASE: ${{ secrets.FANCAD_UPDATE_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${UPDATE_KEY_B64:-}" ]]; then
            echo "FANCAD_UPDATE_KEY_B64 is not configured" >&2
            exit 1
          fi
          if [[ -z "${UPDATE_KEY_PASSPHRASE:-}" ]]; then
            echo "FANCAD_UPDATE_KEY_PASSPHRASE is not configured" >&2
            exit 1
          fi
          key="$RUNNER_TEMP/fancad-update.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s' "$UPDATE_KEY_B64" | base64 -d > "$key"
          chmod 600 "$key"
          FANCAD_UPDATE_KEY_PASSPHRASE="${UPDATE_KEY_PASSPHRASE:-}" \
            scripts/sign_update_manifest.sh \
            release-assets/manifest.json "$key"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: changelog_latest.md
          files: release-assets/*
          fail_on_unmatched_files: true
