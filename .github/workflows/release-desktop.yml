name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.38.4

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version:[[:space:]]*\([0-9.]*\).*/\1/p' pubspec.yaml | head -n1)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VERSION}"

  build-macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake
        run: brew install cmake

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build macOS release
        env:
          FANCAD_REQUIRE_LIBREDWG: "1"
        run: flutter build macos --release

      - name: Package DMG
        run: |
          chmod +x scripts/package_macos_dmg.sh
          scripts/package_macos_dmg.sh "${{ needs.version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: fancad-macos
          path: dist/fancad-macos-${{ needs.version.outputs.version }}.dmg
          if-no-files-found: error

  build-windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cmake
        run: choco install cmake -y

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Windows release
        env:
          FANCAD_REQUIRE_LIBREDWG: "1"
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Download VC++ Redistributable
        shell: pwsh
        run: |
          $url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          $out = "windows/installer/VC_redist.x64.exe"
          Invoke-WebRequest -Uri $url -OutFile $out
          if (-not (Test-Path $out)) { throw "Failed to download VC_redist.x64.exe" }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $version = "${{ needs.version.outputs.version }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "windows\installer\fancad.iss" `
            "/DMyAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: fancad-windows
          path: dist/fancad-windows-setup-${{ needs.version.outputs.version }}.exe
          if-no-files-found: error

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          FANCAD_REQUIRE_LIBREDWG: "1"
        run: flutter build linux --release

      - name: Package tarball
        run: |
          version="${{ needs.version.outputs.version }}"
          mkdir -p dist
          tar -C build/linux/x64/release/bundle -czf "dist/fancad-linux-${version}.tar.gz" .

      - uses: actions/upload-artifact@v4
        with:
          name: fancad-linux
          path: dist/fancad-linux-${{ needs.version.outputs.version }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/fancad-macos/*.dmg release-assets/
          cp artifacts/fancad-windows/*.exe release-assets/
          cp artifacts/fancad-linux/*.tar.gz release-assets/
          ls -la release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
