name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the running job pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.38.4

jobs:
  analyze:
    name: Analyze and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib pkg test

      - name: Analyze
        run: flutter analyze

      - name: Test the pure-Dart packages
        run: |
          dart test pkg/fancad_core
          dart test pkg/fancad_ai

      - name: Test the Flutter packages
        run: flutter test
