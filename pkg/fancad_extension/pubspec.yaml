name: fancad_extension
description: "Extension runtime: one sandboxed JavaScript engine per run, on a worker isolate."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  fancad_core:
    path: ../fancad_core
  json_annotation: ^4.9.0
  meta: ^1.16.0
  # QuickJS-NG, identical engine on every desktop platform. Scripts run on
  # their own isolate so a runaway extension cannot stall the UI.
  quickjs_engine: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.0
