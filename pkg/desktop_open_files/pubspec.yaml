name: desktop_open_files
description: "Desktop file-open events: argv on Windows/Linux, Apple Events on macOS."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.3
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: OpenFilesPlugin
      macos:
        pluginClass: OpenFilesPlugin
      windows:
        pluginClass: OpenFilesPlugin
