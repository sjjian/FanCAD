name: fancad_dwg
description: "DWG/DXF import and export. Bundles a C shim over GNU LibreDWG and the FCB columnar transfer format."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.3

dependencies:
  fancad_core:
    path: ../fancad_core
  ffi: ^2.1.3
  meta: ^1.16.0
  # Build-hook toolchain. Upper bounds matter here: newer releases require
  # meta ^1.19, which conflicts with the meta version pinned by the Flutter
  # SDK's flutter_test.
  hooks: ^2.0.0
  code_assets: ^1.2.0
  native_toolchain_c: ^0.19.0
  logging: ^1.3.0

dev_dependencies:
  test: ^1.25.0
  lints: ^6.0.0

hooks:
  user_defines:
    # Optional override. When empty the hook compiles
    # the LibreDWG git submodule as a static library.
    libredwg_root: ''
