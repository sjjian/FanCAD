name: fancad_core
description: "FanCAD CAD engine: geometry, documents, editing, commands and drawing I/O."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.3

dependencies:
  collection: ^1.19.0
  ffi: ^2.1.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  logging: ^1.3.0
  meta: ^1.16.0
  # Build-hook toolchain. Upper bounds matter here: newer releases require
  # meta ^1.19, which conflicts with the Flutter SDK's pinned version.
  hooks: ^2.0.0
  code_assets: ^1.2.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  build_runner: ^2.5.4
  fancad_test:
    path: ../fancad_test
  freezed: ^3.1.0
  json_serializable: ^6.9.0
  lints: ^6.0.0
  test: ^1.25.0

hooks:
  user_defines:
    # Optional override. When empty the hook compiles the LibreDWG submodule.
    libredwg_root: ''
