name: fancad_ui
description: "The FanCAD design system and application shell: theme tokens, panels, command palette, command line, tools."
version: 0.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  fancad_core:
    path: ../fancad_core
  fancad_render:
    path: ../fancad_render
  fancad_dwg:
    path: ../fancad_dwg
  fancad_plugin_host:
    path: ../fancad_plugin_host
  fancad_ai:
    path: ../fancad_ai
  flutter_riverpod: ^2.6.1
  file_selector: ^1.0.3
  meta: ^1.16.0
  path: ^1.9.0
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
