tags:
  # Mirrors pkg/fancad_io/dart_test.yaml so `dart test pkg/fancad_io` from the
  # workspace root still skips nativeGroup suites. `--tags native --run-skipped`
  # fails and names FANCAD_LIBREDWG_ROOT when the backend is not linked.
  native:
    skip: "Run with --tags native in a build that links LibreDWG"
